# NWW-V12 蓝图（细纲）Schema v0.2
# 基于 E1b 规律二：蓝图颗粒度决定剧情正确性
# 七要素缺一即视为不合格，writer 有权打回

schema_version: "0.2.0"

# ═══════════════════════════════════════════════════════════
# 七要素定义
# ═══════════════════════════════════════════════════════════

seven_elements:
  1. 任务:
     description: "本章要完成什么具体目标"
     required: true
     format: "一句话，必须是可验证的动作"
     example: "沈砚发现蝗蝻高发地的呈报数字与历年同期存在统计异常"
     rules:
       - "必须具体可执行，不能是「推进剧情」等空泛表述"
       - "必须有明确的完成标准"

  2. 地点:
     description: "场景空间"
     required: true
     format: "具体地点 + 空间特征"
     example: "钦天监值房，深夜，只有沈砚一人"
     rules:
       - "必须明确空间边界"
       - "环境特征必须服务于剧情"

  3. 人物所求:
     description: "角色在本章的目标与动机"
     required: true
     format: "谁 + 想要什么 + 为什么"
     example: "沈砚想要发现异常并上报，但因为怕欺君而犹豫"
     rules:
       - "每个出场角色必须有明确目标"
       - "目标之间必须存在冲突或张力"

  4. 冲突:
     description: "阻力来源（外部/内部/环境）"
     required: true
     format: "什么阻碍了目标的达成"
     example: "掌案郑直笑他多心；天机反噬的风险"
     rules:
       - "冲突必须有具体来源"
       - "禁止「命运」等抽象阻力"

  5. 转折:
     description: "意外事件（改变剧情走向）"
     required: true
     format: "发生了什么意外"
     example: "沈砚借观星起卦，当众预告蝗灾，引发值房哗然"
     rules:
       - "转折必须出人意料但合情合理"
       - "转折后必须产生新的困境"

  6. 结果:
     description: "本章结束时的状态变化"
     required: true
     format: "从 A 状态变为 B 状态"
     example: "沈砚咳血（代价）；郑直态度从看笑话转为刮目相看"
     rules:
       - "必须体现人物的实际变化"
       - "禁止「尘埃落定」等状态判词"

  7. 反派动作:
     description: "≥1次主动出手（如有反派/对手）"
     required: false
     condition: "当存在对立势力时必填"
     format: "谁 + 做了什么 + 目的是什么"
     example: "周敬亭在正堂翻查同一批文书，指尖停在某州县名字上"
     rules:
       - "反派必须主动，不能被动等待主角行动"
       - "反派动作必须与主角形成对应"

# ═══════════════════════════════════════════════════════════
# 完整细纲模板
# ═══════════════════════════════════════════════════════════

outline_template: |
  # 第{N}章 {章名}
  
  ## 七要素蓝图
  
  ### 1. 任务
  - {一句话目标}
  
  ### 2. 地点
  - {地点 + 环境特征}
  
  ### 3. 人物所求
  - {角色}：{想要什么}（因为{原因}）
  
  ### 4. 冲突
  - {阻力来源}
  
  ### 5. 转折
  - {意外事件}
  
  ### 6. 结果
  - {状态变化}
  
  ### 7. 反派动作
  - {反派主动出手}（如有）
  
  ## 元数据
  
  - 字数目标：{按平台规范}
  - 字数口径：visible_chars_v1
  - 目标情绪：{爽/憋/笑/泪/惊}
  - 核心事件：{一句话概括}
  - 逻辑线：{起因 → 发展 → 转折 → 高潮 → 结尾}
  
  ## 出场角色 voice 锚点
  
  - {角色名}：①认知标尺：{衡量人与事的标尺/惯用意象} ②句法节奏：{句长分布/典型句序} ③情绪变调：{放松/施压/动怒时的说话变化} ④低频锚点：{词或「无」}（可用：{状态}；禁用于：{状态}；功能：{情绪作用}）
  
  ## 必种件清单
  
  - [ ] {可验收的具体事件}
  
  ## 章尾钩子
  
  - 类型：{威胁/选择/代价/揭示/关系}
  - 内容：{具体钩子内容}

# ═══════════════════════════════════════════════════════════
# 示例：第1章
# ═══════════════════════════════════════════════════════════

example:
  chapter: 1
  title: "值房里那架算盘"
  seven_elements:
    任务: "沈砚在值房抄录文书时发现蝗蝻高发地的呈报数字异常"
    地点: "钦天监值房，深夜，只有沈砚一人"
    人物所求:
      - "沈砚：发现异常并上报（因为这是他的职责）"
      - "郑直：维持现状（因为不想惹麻烦）"
    冲突:
      - "外部：账目显示异常但无实证"
      - "内部：怕欺君之罪不敢直接上报"
    转折: "沈砚借观星起卦当众预告蝗灾，值房哗然"
    结果:
      - "沈砚：咳血，天机反噬+1"
      - "郑直：从看笑话转为刮目相看"
    反派动作:
      - "周敬亭在正堂翻查同一批文书，指尖停在某州县名字上"
  metadata:
    wordcount_target: 3500
    wordcount_format: visible_chars_v1
    target_emotion: "惊"
    core_event: "沈砚穿越后发现账目异常，借观星起卦预告蝗灾，触发天机反噬"
    logic_line: "沈砚当值抄录文书 → 发现数字异常 → 心理过了一遍样本与周期 → 借观星起卦 → 值房哗然 → 天机反噬+1，胸口一闷咳出血"
  voice_anchors:
    沈砚:
      - "命只有一条"
      - "数字说话"
      - "禁止直接说结论"
    郑直:
      - "年轻人有冲劲是好事"
      - "按规矩办事"
  must_keep:
    - "发现数字异常"
    - "借观星起卦"
    - "天机反噬+1"
    - "咳血"
  hook:
    type: "揭示"
    content: "周敬亭翻查文书，停在某州县名字上"

# ═══════════════════════════════════════════════════════════
# 校验规则
# ═══════════════════════════════════════════════════════════
validation:
  required_check: "七要素中1-6必须存在，第7要素在有对立势力时必填"
  task_specific: "任务必须具体可验证"
  conflict_present: "冲突不能为空"
  result_change: "结果必须体现状态变化"
  hook_type: "章尾钩子必须标注类型"
  voice_anchors: "每个出场角色必须有 voice 锚点"
  must_keep: "必种件清单必须可验收"
