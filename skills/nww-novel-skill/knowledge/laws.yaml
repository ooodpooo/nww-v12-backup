# NWW-V12 规律库 v0.2
# 从实验 E1~E1d 中提炼的可执行规律
# 规律即代码：改规律不改 prompt，prompt 动态拼装

version: "0.2.0"
evidence_base: "E1c/B''版（幽默修复）+ E1d（过度约束反例）"
last_updated: "2026-09-10"

---

# ═══════════════════════════════════════════════════════════
# 规律一：结构保下限，范例提上限
# 来源：E1(A/B/C对照) → A<C<B''
# ═══════════════════════════════════════════════════════════
laws:
  - id: 1
    name: 结构保下限范例提上限
    version: 1
    scope: [writer, planner]
    priority: high
    statement: |
      良好的结构（场景五要素/反转设计）保证下限；
      题材匹配的文风范例提升上限。无范例时结构仍能运转，
      有范例时能突破模板感。
    evidence: "E1a(无范例) < E1b(通用范例) < E1c(B''题材匹配)"
    injection:
      when: "writer 写正文前、planner 设计蓝图时"
      how: "从 style_exemplars/ 按题材路由加载范例片段"
    action:
      - "planner 输出 blueprint 时，必须指定 genre_prose_card"
      - "writer 写前必读 genre-prose-cards/{题材}.md"

---

# ═══════════════════════════════════════════════════════════
# 规律二：蓝图颗粒度决定剧情正确性
# 来源：E1b 规律九/十
# ═══════════════════════════════════════════════════════════
  - id: 2
    name: 蓝图颗粒度决定剧情正确性
    version: 1
    scope: [planner]
    priority: high
    statement: |
      Planner 输出必须是七要素蓝图（场景五要素 + 反派动作 + 幽默节拍），
      缺一要素即视为不合格，writer 有权打回。
    evidence: "E1b(七要素) 比 E1a(五要素) 剧情正确性高 40%"
    injection:
      when: "planner 生成细纲时"
      how: "强制七要素模板输出"
    seven_elements:
      - "任务（本章要完成什么）"
      - "地点（场景空间）"
      - "人物所求（角色目标）"
      - "冲突（阻力来源）"
      - "转折（意外事件）"
      - "结果（本章结束状态）"
      - "反派动作（≥1次主动出手）"

---

# ═══════════════════════════════════════════════════════════
# 规律三：过度约束会降质
# 来源：E1d("暖水袋"事件)
# ═══════════════════════════════════════════════════════════
  - id: 3
    name: 过度约束会降质
    version: 1
    scope: [planner, writer]
    priority: critical
    statement: |
      LLM Critic 重写环节会导致质变劣化（E1d 证据）。
      自检只做正则扫描 + 人工标记，不做自动重写。
    evidence: "E1d 过度约束反例：暖水袋事件导致人设崩塌"
    injection:
      when: "机械自检环节"
      how: "只输出 S1-S4 问题报告，不自动修改"
    rule: "禁止 writer 根据 critic 报告自动重写，必须交给人工确认"

---

# ═══════════════════════════════════════════════════════════
# 规律四：幽默是配方不是天赋
# 来源：E1b 规律十一
# ═══════════════════════════════════════════════════════════
  - id: 4
    name: 幽默是配方
    version: 1
    scope: [character_designer, writer]
    priority: high
    statement: |
      幽默角色必须有明确的喜剧配方：傲慢方向 + 缺德话公式 + 护短逻辑。
      无配方的幽默角色会沦为尴尬搞笑。
    evidence: "E1b 规律十一：B''版成功关键 = 角色喜剧配方"
    injection:
      when: "character_designer 创建角色卡时、writer 写喜剧场景时"
      how: "强制填写喜剧配方字段"
    comedy_recipe:
     傲慢方向: "角色傲慢于什么（学识/武力/地位）"
      缺德话公式: "角色如何用语言攻击他人"
      护短逻辑: "角色保护谁、为什么保护"

---

# ═══════════════════════════════════════════════════════════
# 规律五：口癖相撞是高频残留病
# 来源：E1c 盲评统计
# ═══════════════════════════════════════════════════════════
  - id: 5
    name: 口癖排他性
    version: 1
    scope: [character_designer, writer]
    priority: high
    statement: |
      每个角色的口癖/句式必须在全书唯一，不允许两个角色
      使用相同的口头禅或句式模板。
    evidence: "E1c 盲评高频病 #1：角色对话可互换"
    injection:
      when: "character_designer 创建角色卡时、writer 写对话时"
      how: "口癖字段必须全局唯一校验"
    rule: "新角色口癖必须与已有角色不重复，重复则打回"

---

# ═══════════════════════════════════════════════════════════
# 规律六：模板比喻是 AI 指纹
# 来源：E1c 盲评统计
# ═══════════════════════════════════════════════════════════
  - id: 6
    name: 模板比喻禁用
    version: 1
    scope: [writer]
    priority: high
    statement: |
      「仿佛/犹如/宛若……一般」等模板比喻是高频 AI 指纹。
      单个有功能的生活化比喻可保留，堆叠比喻必须删。
    evidence: "E1c 盲评高频病 #2：万能比喻"
    injection:
      when: "writer 写正文时、机械自检时"
      how: "正则扫描 + 替换"
    banned_patterns:
      - "仿佛.*一般"
      - "犹如.*般"
      - "宛若.*似的"
      - "像潮水般"
      - "如闪电般"
      - "仿佛春风"

---

# ═══════════════════════════════════════════════════════════
# 规律七：prompt 泄漏是高频残留病
# 来源：E1c 盲评统计
# ═══════════════════════════════════════════════════════════
  - id: 7
    name: Prompt 泄漏检测
    version: 1
    scope: [writer]
    priority: critical
    statement: |
      正文中出现 prompt 原话（蓝图措辞、指令词）是严重泄漏。
      必须扫描并清除。
    evidence: "E1c 盲评高频病 #3：蓝图原话进入正文"
    injection:
      when: "writer 写正文后、机械自检时"
      how: "diff 扫描蓝图与正文，匹配度 >80% 即标记"
    rule: "蓝图措辞不得原样进入正文，必须转化为叙述"

---

# ═══════════════════════════════════════════════════════════
# 规律八：规律随盲评持续进化
# 来源：E1~E1d 十七条规律
# ═══════════════════════════════════════════════════════════
  - id: 8
    name: 规律版本化热更新
    version: 1
    scope: [all]
    priority: medium
    statement: |
      规律库必须版本化，每次盲评后可以新增/修订规律。
      prompt 动态拼装，改规律不改代码。
    evidence: "E1~E1d 提炼十七条规律"
    injection:
      when: "系统启动时"
      how: "读取 laws.yaml，按 scope 注入对应 agent"
    version_control:
      - "laws.yaml 每次修改必须 bump version"
      - "每个章的 generation_meta.json 记录使用的 law_version"
      - "规律改动必须跑回归测试（E1 式对照）"

---

# ═══════════════════════════════════════════════════════════
# 规律九：开篇即戏
# 来源：E1b 规律九
# ═══════════════════════════════════════════════════════════
  - id: 9
    name: 开篇即戏
    version: 1
    scope: [writer]
    priority: high
    statement: |
      前 100 字必须包含 ≥3 个事件密度点，禁止大段环境描写开场。
      冲突前置，开篇即有张力。
    evidence: "E1b 规律九：黄金三章法则"
    injection:
      when: "writer 写开篇时"
      how: "正则扫描前 100 字，统计事件密度"
    metric:
      min_events_in_100_chars: 3
      banned_opening_patterns:
        - "环境描写开场"
        - "背景介绍开场"
        - "作者视角总结开场"

---

# ═══════════════════════════════════════════════════════════
# 规律十：情绪弧线必须可验收
# 来源：E1b 规律十
# ═══════════════════════════════════════════════════════════
  - id: 10
    name: 情绪弧线可验收
    version: 1
    scope: [planner, writer]
    priority: high
    statement: |
      每章必须明确目标情绪，并在正文结尾验证是否达成。
      无目标情绪 = 不合格蓝图。
    evidence: "E1b 规律十：情绪弧线设计"
    injection:
      when: "planner 生成细纲时、writer 写完正文时"
      how: "细纲必须含 target_emotion，正文结尾自检"
    emotion_types:
      - "爽（打脸/升级/收益）"
      - "憋（压迫/困境/期待）"
      - "笑（喜剧/反差/误会）"
      - "泪（牺牲/离别/成长）"
      - "惊（反转/揭示/危机）"

---

# ═══════════════════════════════════════════════════════════
# 规律十一：三维度揉进
# 来源：E1b 规律十一
# ═══════════════════════════════════════════════════════════
  - id: 11
    name: 三维度揉进
    version: 1
    scope: [writer]
    priority: high
    statement: |
      每个场景必须揉进三维度：发生（事件）+ 感知（感官）+ 反应（身体）。
      三者织在同一段，不按维度分段写。
    evidence: "E1b 规律十一：场景写法核心"
    injection:
      when: "writer 写场景时"
      how: "每段自检三维度是否齐全"
    three_dimensions:
      - "发生：这件事出现了（1-2 句叙事）"
      - "感知：主角注意到的感官细节（至少 1 个不同感官）"
      - "反应：身体如何回应（具体的身体动作）"

---

# ═══════════════════════════════════════════════════════════
# 规律十二：章尾钩子必须威胁性
# 来源：E1c 盲评统计
# ═══════════════════════════════════════════════════════════
  - id: 12
    name: 章尾钩子威胁性
    version: 1
    scope: [planner, writer]
    priority: high
    statement: |
      章尾钩子必须是威胁性（危机/选择/代价），不能是温和悬念。
      连续章节避免使用完全同类钩子。
    evidence: "E1c 盲评：钩子质量决定续读率"
    injection:
      when: "planner 设计章尾、writer 写收尾时"
      how: "钩子类型标签 + 连续章节钩子类型轮换检查"
    hook_types:
      - "威胁型（危机降临）"
      - "选择型（两难困境）"
      - "代价型（收益伴随代价）"
      - "揭示型（新信息颠覆认知）"
      - "关系型（关系转折点）"

---

# ═══════════════════════════════════════════════════════════
# 规律十三：代价不可逆
# 来源：E1b 规律十三
# ═══════════════════════════════════════════════════════════
  - id: 13
    name: 代价不可逆
    version: 1
    scope: [planner, writer]
    priority: critical
    statement: |
      每次使用金手指/特殊能力必须记录代价，代价只进不退。
      追踪状态必须反映代价累积。
    evidence: "E1b 规律十三：代价系统"
    injection:
      when: "planner 设计情节时、writer 写使用能力时、追踪提交时"
      how: "nww_track_commit.py 自动累加代价计数"
    rule: "代价字段 count 只增不减，write_chapter 后必须 update"

---

# ═══════════════════════════════════════════════════════════
# 规律十四：人物卡七维度
# 来源：E1b 规律十四
# ═══════════════════════════════════════════════════════════
  - id: 14
    name: 人物卡七维度
    version: 1
    scope: [character_designer]
    priority: high
    statement: |
      每个角色卡必须包含七维度：身份/欲望/缺陷/口癖/人化细节/喜剧配方/关系锚。
      缺任一经为不合格。
    evidence: "E1b 规律十四：角色卡标准"
    injection:
      when: "character_designer 创建角色卡时"
      how: "Schema 校验，缺一维度即打回"
    seven_dimensions:
      - "身份（社会位置/职业）"
      - "欲望（核心驱动力）"
      - "缺陷（致命弱点/盲区）"
      - "口癖（语言特征，全局唯一）"
      - "人化细节（1-2 个具体习惯动作）"
      - "喜剧配方（傲慢方向/缺德话/护短逻辑，仅喜剧角色）"
      - "关系锚（与主角关系定位）"

---

# ═══════════════════════════════════════════════════════════
# 规律十五：道具三次出现规则
# 来源：E1b 规律十五
# ═══════════════════════════════════════════════════════════
  - id: 15
    name: 道具三次出现
    version: 1
    scope: [planner, writer]
    priority: medium
    statement: |
      每个贯穿道具必须出现 3 次，每次意义翻转。
      首次建立、二次颠覆、三次暴击。
    evidence: "E1b 规律十五：契诃夫之枪"
    injection:
      when: "planner 设计道具时、writer 写道具出场时"
      how: "道具出现记录表 + 意义翻转检查"
    three_appearances:
      - "首次（前 1/4）：建立初始意义"
      - "二次（中段）：意义被颠覆"
      - "三次（结尾）：情感暴击"

---

# ═══════════════════════════════════════════════════════════
# 规律十六：疏密分配
# 来源：E1c 盲评统计
# ═══════════════════════════════════════════════════════════
  - id: 16
    name: 疏密分配
    version: 1
    scope: [writer]
    priority: medium
    statement: |
      详写子事件 ≥100-150 字，过场连接 1-2 句带过。
      不要每个子事件平均用力。
    evidence: "E1c 盲评：节奏均质化是 AI 特征"
    injection:
      when: "writer 写正文时"
      how: "段落长度分布检查"
    density_rule:
      detailed_scene_min_chars: 100
      detailed_scene_max_chars: 200
      transition_max_chars: 30

---

# ═══════════════════════════════════════════════════════════
# 规律十七：金句锚定
# 来源：E1c 盲评统计
# ═══════════════════════════════════════════════════════════
  - id: 17
    name: 金句锚定
    version: 1
    scope: [writer]
    priority: medium
    statement: |
      每章至少 1 句可引用的金句（台词/内心/观察）。
      金句必须是角色化的，不是作者总结。
    evidence: "E1c 盲评：金句是读者传播点"
    injection:
      when: "writer 写完正文时"
      how: "扫描正文提取潜在金句，数量 <1 则 warning"

