# ═══════════════════════════════════════════════════════════
# 规律十八：手法冷却与句式去重律
# 来源：实战抗复读与文采多样性
# ═══════════════════════════════════════════════════════════
  - id: 18
    name: 手法冷却与句式去重律
    version: 1
    scope: [writer, planner]
    priority: high
    statement: |
      人类作家不当复读机。同一种修辞手法必须遵守冷却间距，
      描写手段必须按场景维度差异化落地，禁止将文采偷懒落成单一比喻句式。
    evidence: "单章比喻/同句式高频复读会导致文采严重劣化"
    injection:
      when: "writer 写正文时、机械自检时"
      how: "手法冷却检查 + 描写落地分流"
    rules:
      - "修辞冷却期：明喻/隐喻在正文中冷却间距 ≥ 600 字，单章比喻总数 ≤ 3 处"
      - "威压/气势：落地为生理反应或物理环境反馈，严禁抽象定性比喻（如'像沉睡的兽'）"
      - "动作/交锋：落地为力矩/支点/受力材质/接触声响，禁止用比喻代替物理交互过程"
      - "心理活动：落地为利益算计与动作停顿，禁止作者跳出下定性断语"
      - "同构句式禁连续：严禁相邻段落采用相同的句式结构起笔或收束"
