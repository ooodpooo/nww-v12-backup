# beat_capacity_schema — ch16《再算一卦》范本（已成功章）
#
# 用途：把 ch16（改版爆点示范章，正文 5187 字）转成 beat 标注版，
#       作为「schema 可迁移」的实证样本，供后续新模型生成细纲时对照。
# 验证锚点：改版正文 12 段即为下方 12 beat 的落地产物——每一段都来自 schema
#           约束下的「可演骨架」，而非孤立字数。未改正文，本文件为独立标注副本。
#
# 类型分布：A×5（段二/四/五/八/十）+ B×3（段一/三/七）+ C×4（段六/九/十一/十二）

chapter: 第16章 再算一卦
正文字数: 5187（纯汉字，口径 visible_chars_v1）
成功关键: 段五 = 结果句「发现周要利用自己」被 B/A 骨架逼成「逼签→重核→看穿真意→反问→拍板」多轮博弈

beats:

  # 段一 · 值房传唤（开篇即戏）
  - id: Beat-01
    对应正文段: 一
    事件功能: 传唤敲门，抽抄本引信
    容量类型: B 行动推进
    目标长度: 350
    最少往返: 1
    必须产生变化: [行动方向]
    展开要求: 敲门传唤 → 沈抽抄本一角按回 → 择签卷随行
    禁止: [内心铺陈开篇, 环境撑字]

  # 段二 · 正堂签供，周抛「天意」
  - id: Beat-02
    对应正文段: 二
    事件功能: 周三层递话（认账→御史折子→天意），逼沈表态
    容量类型: A 冲突展开
    目标长度: 500-600
    最少往返: 3
    必须产生变化: [信息变化, 威胁变化]
    展开要求:
      1. 周问河东账平不平 → 沈「簿子上平」
      2. 周抛御史折子（三县不对）
      3. 周抛天意（你怎么看）→ 沈不接，只垫「数要对得上账」
    禁止: [沈提前明牌, 周直说真实目的]

  # 段三 · 灾册细节，暗记三县
  - id: Beat-03
    对应正文段: 三
    事件功能: 沈翻灾册，以动作咬住三县数
    容量类型: B 行动推进
    目标长度: 450
    最少往返: 2
    必须产生变化: [信息变化]
    展开要求: 翻册对村数/赈额 → 眼下三县旧账吻合 → 开口要求「当场核」
    禁止: [写「他默记」旁白, 直接宣布结论]

  # 段四 · 身份敲打（对话双职能）
  - id: Beat-04
    对应正文段: 四
    事件功能: 周点沈出身拉拢+试把柄，沈不接钩
    容量类型: A 冲突展开
    目标长度: 400-500
    最少往返: 2
    必须产生变化: [关系变化]
    展开要求:
      1. 周「你替核账不落好，恨不恨」
      2. 沈「学生核账为账本身平，不靠人记得」
      3. 周「本分好，天意托给你」
    禁止: [沈露把柄, 周完全得手]

  # 段五 · 核对→看穿周真意→应卦（D2 核心）
  - id: Beat-05
    对应正文段: 五
    事件功能: 代签供+重核+拍板应卦；周真图谋（背锅）由动作/周话托出
    容量类型: A 冲突展开（决策）
    目标长度: 700-800
    最少往返: 3
    必须产生变化: [信息变化, 判断变化, 威胁变化, 行动方向]
    展开要求:
      1. 周推签供（代州里签）→ 递大典名分
      2. 沈重核第三遍 → 看清「三县是饵、要背锅人」
      3. 周加码「活神仙的口，不是哪册账」
      4. 沈反问「实指哪一册」→ 周「你核得平就签得实」
      5. 沈一次拍板「这一卦，学生认」
    禁止: [直接揭露周全部图谋, 内心双面权衡>1句]

  # 段六 · 署名暗记（证束留白）
  - id: Beat-06
    对应正文段: 六
    事件功能: 沈签名册但对周缝漏「当庭证束」栏
    容量类型: C 转折锚点（反制落子）
    目标长度: 300-400
    最少往返: 1
    必须产生变化: [行动方向]
    展开要求: 落名 → 在「证束」栏悬笔不落 → 「只签象数，不签因果」→ 周误读为怕担责
    禁止: [周当场识破（留事后）, 强行撑到500字]

  # 段七 · 廊下审官（反差）
  - id: Beat-07
    对应正文段: 七
    事件功能: 同僚试探，沈钉「核数在先知先」宣示
    容量类型: B 行动推进
    目标长度: 400
    最少往返: 1-2
    必须产生变化: [信息变化]
    展开要求: 同僚「这是替监正应卦的天意」→ 沈「数核平才轮得上天意」→ 余音落幕
    禁止: [沈明说「我要掀桌」, 群像生成姓名]

  # 段八 · 郑直夜访（关系余音）
  - id: Beat-08
    对应正文段: 八
    事件功能: 郑直交底劝退，沈摊实存册立誓
    容量类型: A 冲突展开（对白）
    目标长度: 500-600
    最少往返: 3
    必须产生变化: [信息变化, 关系变化, 威胁变化]
    展开要求:
      1. 郑「你给监正应了一卦」→ 交底「他要借你坐实天意」
      2. 沈「正因为知道才签」→ 摊册「这本数得出来」
      3. 郑「从今起你欠我的不是一壶酒」
    禁止: [郑直完全明白沈全盘计划]

  # 段九 · 名帖钉死（信息落子）
  - id: Beat-09
    对应正文段: 九
    事件功能: 沈写名帖，钉死「两册并提」
    容量类型: C 转折锚点
    目标长度: 250-350
    最少往返: 1
    必须产生变化: [行动方向]
    展开要求: 研墨 → 落两行 → 压回案底
    禁止: [解释回头的路何故走死（留推断）, 强行撑到500字]

  # 段十 · 灯下对账三遍（证据链）
  - id: Beat-10
    对应正文段: 十
    事件功能: 对灾名→对村数→对赈额，得出四成差
    容量类型: A 冲突展开（查证）
    目标长度: 550
    最少往返: 3
    必须产生变化: [信息变化]
    展开要求: 三遍逐格对 → 得两成虚报+两成瞒发=四成 → 看清周要坐实的「灾」
    禁止: [只讲结论不带过程, 内心替查证]

  # 段十一 · 章尾自我定位（收束）
  - id: Beat-11
    对应正文段: 十一
    事件功能: 动作收束一句信念，吹灯
    容量类型: C 转折锚点（收束）
    目标长度: 150-250
    最少往返: 0-1
    必须产生变化: [判断变化]
    展开要求: 按名帖压纸纹 → 「账不会骗人」未出口压进纸 → 吹灯
    禁止: [作者旁白议理, 思想>剧情占比]

  # 段十二 · 周敬亭暗场·识破（章尾钩子）
  - id: Beat-12
    对应正文段: 十二
    事件功能: 周确认「此人不按预想走」，点未知勾子
    容量类型: C 转折锚点（章尾钩子）
    目标长度: 200-300
    最少往返: 1
    必须产生变化: [信息变化, 威胁变化]
    展开要求: 周「答应得太顺」→「不按我的预想走」→「他真带进的哪一本，我倒要看看」→ 收灯影
    禁止: [周点破沈底牌]

# 使用建议（A/B 对照测试用）
#  章节组 A（不开 schema）：细纲只给结果句 → 期望字数亏空/注水
#  章节组 B（开 schema）：细纲输出上方 12 beat 骨架 → 期望自然 ≥4000 且不注水
#  开关字段：experiment.enabled.beat_capacity（非 .nrl.enabled）