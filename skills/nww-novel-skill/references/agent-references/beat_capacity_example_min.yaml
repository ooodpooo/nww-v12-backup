# beat_capacity_schema — 最小输出样例
#
# 用途：验证 schema 能否把「一句话结果」逼成「多轮事件骨架」。
#
# 无 schema 时，细纲往往写成结果句：
#   "上峰召见 → 解释旧案 → 主角识破阴谋 → 应下差事"（4 行，Writer 无过程可写）
#
# 有 schema 后，同一事件必须展开成：试探 → 回避 → 再压 → 交换条件 → 留钩子。
# 如下 4 个 beat，混 A/B/A/C 三类，足以验证约束力。

chapter: 架空·官场博弈章（示例骨架，非正文）

beats:

  - id: Beat-01
    事件功能: 上峰召见，抛出旧案
    容量类型: A 冲突展开
    目标长度: 600-800
    最少往返: 3
    必须产生变化:
      - 信息变化
      - 关系变化
      - 威胁变化
    展开要求:
      1. 上峰先试探态度（抛案是否认得）
      2. 主角不接话头（回避立场）
      3. 上峰加码（点出牵连 / 递名分）
      4. 双方确认立场差异（一个要「天意定论」，一个要「数来定论」）
    禁止:
      - 直接说明上峰真实目的
      - 主角提前知道全部阴谋

  - id: Beat-02
    事件功能: 主角核对卷宗，暗记关键数
    容量类型: B 行动推进
    目标长度: 250-400
    最少往返: 1-2
    必须产生变化:
      - 信息变化
    展开要求:
      翻册 → 对三处数 → 以动作咬住差数
    禁止:
      - 写「他默记」旁白
      - 环境撑字

  - id: Beat-03
    事件功能: 主角被迫决断（应 or 不应）
    容量类型: A 冲突展开（决策）
    目标长度: 500-700
    最少往返: 2-3
    必须产生变化:
      - 判断变化
      - 行动方向
    展开要求:
      1. 上峰逼签（递锁链）
      2. 主角以核对动作托出判断
      3. 一次拍板（台词落地）
    禁止:
      - 内心双面权衡 > 1 句
      - 主角当堂揭底

  - id: Beat-04
    事件功能: 章尾暗场·反派识破
    容量类型: C 转折锚点 / 章尾钩子
    目标长度: 200-300
    最少往返: 1
    必须产生变化:
      - 信息变化
      - 威胁变化
    展开要求:
      反派确认「此人不按我预想走」→ 点「他要看的到底是哪一本」→ 收灯影
    禁止:
      - 反派把主角底牌点破