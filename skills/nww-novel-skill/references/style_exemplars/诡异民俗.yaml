genre: 诡异民俗
source: 阴德清算师（用户给定题材脚本，诡异民俗赛道）
validated: "kimi-run 新增，供 v12 跑非喜剧题材"
metaphor_examples:
  - "那人寿数像一截浸了水的棉线，黑雾缠在上面，越缠越沉，是他从别人身上硬抽来的。"
  - "神坛前的供果红得发假，像涂了层廉价的胭脂，底下压着三十七条人命的欠条。"
  - "沈折拨弄腕间那串算盘珠子，声音又干又脆，像在替阎王点名。"
  - "借来的气运在他头顶凝成一层油膜，亮得晃眼，一戳就破，里面全是别人的霉味。"
exemplars:
  - type: 冷硬第一人称叙事+具体意象
    text: |
      我七岁那年，村口狐仙庙吞了我妹的命。
      不是病，不是 accident，是庙里那尊泥胎睁开眼，点了她的名。
      从那以后我只信一样东西——账本。神坛会骗人，账本不会。
      谁欠的，谁还；谁偷的，谁吐。
  - type: 反向金手指展示（拆外挂吞寿命）
    text: |
      他腕上那根红绳突然断了。
      不是绳老，是我用指尖一勾，勾断了缠在他命数上的那道借寿符。
      红绳落地的一刻，他整个人塌了半寸——那是被抽走的三十年，正顺着我的指缝灌进我体内。
      我说过，别人求神拜佛，我专砸神坛。
  - type: 诡异氛围+留钩子冷收
    text: |
      供桌底下的阴影里，多出了一双绣花鞋。
      鞋尖朝外，像是刚从庙里走出来，又像是正要走进去。
      沈折把算盘珠子拨到最后一格，轻声说："下一单，该你了。"
