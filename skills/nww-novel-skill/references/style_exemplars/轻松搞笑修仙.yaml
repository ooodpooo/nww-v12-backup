genre: 轻松搞笑修仙
source: 没钱修什么仙（基因库实拍选段）
validated: "E1c/B'' 基线"
metaphor_examples:
  - "老鼠啃房梁的声音，像极了上辈子凌晨两点的机械键盘。"
  - "饿过头反上来的胃酸，一股韭菜盒子放馊了的味道。"
  - "王锐飞出去的瞬间，林夜恍惚看见一台被拔掉电源的投影仪——前一秒还亮着，后一秒就只剩黑屏。"
exemplars:
  - type: 对话驱动+反差幽默
    text: |
      中间的面试官望着他，淡淡道："你为什么要报考我们的学校？"
      张羽："贵校悠久的历史，深厚的底蕴，丰富的教学资源，一直以来为社会培养出了许多杰出人才……"
      面试官皱了皱眉，打断道："别说这些场面话。"
      张羽老实道："我想考上名牌大学，嵩阳高中是我能报考的学校中，大学录取率最高的一个。"
      "你成绩没有问题，但想要进嵩阳高中，光靠校内考试成绩是远远不够的。"他想了想，随意问道："你现在每天睡多久？"
      张羽："五个小时。"
      面试官意外道："五小时？我们学校的学生从小学开始，每天平均睡眠时长都不超过两个小时。而像历届的优秀毕业生基本上都是不睡觉的。"
  - type: 设定量化发放
    text: |
      而决定一个人能登上哪个仙道境界的关键指标便是道心等级和法力水平。
      像是对高中生来说，唯有道心跨越10级门槛，法力超过60点，才能从炼气境界突破到筑基境界。
      与此同时，一阵阵光波扫过了在场众多学生们的身体，将他们的肉体强度数据都显示在了不远处的大屏幕上从高到低排列。
      第1名，钱深，肉体强度1.15级
      第2名，白真真，肉体强度1.13级
      第3名，何大有，肉体强度1.12级
      而张羽一直到看到第19位，才找到了自己的分数。
      第19名张羽肉体强度0.82级
  - type: 荒诞日常+吐槽
    text: |
      与此同时，周围的同学们纷纷拿出针管扎向自己的胳膊，将各类增强补剂打入自己体内。
      这些各种不同牌子的补剂被送入身体之后，不但会提升筋肉、骨骼的强度，更是会提升数倍到十数倍不等的锻炼效率，是高一学生的必备药物。
      在这里，你可以一天不锻炼，但不能一天不扎针，优秀的学霸更是往往一天八针往上。
