patterns:
  - name: 系统流痕迹
    regex: '(【(检测到|推演进度|自动战斗模块|目标锁定|警告|提示)[^】]{0,20}】|检测到[^。]{0,12}|推演进度[：:]?\d|建议[：:]物理超度|建议[：:]立即(休眠|规避)|目标锁定[：:])'
    severity: high
    example: '【自动战斗模块已激活】或【检测到高热量目标，启动掠夺】或“推演进度：1%”——功法当系统播报的HUD体禁；正常叙事里【功法名】当强调不算'
  - name: 裸括号对白
    regex: '【[^【】]{6,}[！！？。，…：][^】]*】'
    severity: high
    example: '【老夫带你飞！】【当前裂纹：4/7】——用括号包台词/数值面板=系统流HUD体禁；台词一律引号，计数行裸文本'
  - name: 路标词
    regex: '(与此同时|就在这时|不知不觉(中|间)|话说回来|且说|无巧不成书)'
    severity: medium
    example: '“与此同时，千里之外的魔教……”——叙事路标词禁，让读者自己跟上'
  - name: 排比堆砌
    regex: '(不是[，,][^。]{0,12}，而是|一边[，,][^。]{0,12}，一边)'
    severity: medium
    example: '“不是不想逃，而是腿软了”式的不是…而是…排比禁'
  - name: 不是而是句式
    regex: '不是[^。]{0,10}，而是[^。]{0,10}'
    severity: low
    example: '“不是怕你，是怕你丢老夫的脸”式句式少堆'
  - name: 模板比喻
    regex: '(倒吸一口凉气|像打了鸡血(一|似)样|像死(狗|尸)(一|似)样|像(一|坨)滩烂泥|像(?:一|坨)摊烂泥)'
    severity: medium
    example: '“倒吸一口凉气”“像打了鸡血一样”“像死狗一样”等陈词滥调比喻禁；鲜活的具体比喻(像刀子一样)不算'
  - name: 情绪直接命名
    regex: '(他感到(一阵)?(悲伤|愤怒|恐惧|绝望)|一股[一-龥]{1,4}涌上心头)'
    severity: medium
    example: '“他感到一阵悲伤”禁，用动作/生理反应代替'
  - name: 升华金句收尾
    regex: '([林夜他]*(?:这一刻|从这一天起|从今往后|他知道|他明白|他不再是)[，,。][^。]*(命运|人生|世界|修仙之路|最硬的骨头|只想躺平|社畜))'
    severity: high
    example: '“这一刻，他明白了命运”式章节结尾升华金句禁'
  - name: 章节摘要式结尾
    regex: '(坏事[^。]{0,5}正在逼近|危机[^。]{0,5}即将|风暴[^。]{0,5}来临|没有人知道[，。][^。]{0,10}|一场大戏[^。]{0,6}开始|命运[的]?齿轮[^。]{0,6}|真正的考验[^。]{0,6}(才刚刚|拉开)|具体的[^。]{0,8}正在逼近|[林夜他]?不知道的是[^。]{0,10}|退路已断[，。][^。]{0,12}正在|悄然转动|真正的威胁[^。]{0,6}开始|才刚刚开始)'
    severity: high
    example: '“具体的坏事，正在逼近。”“命运齿轮悄然转动”“林夜不知道的是，从明天起…”式章节末总结展望禁'
  - name: 蓝图泄漏词
    regex: '威胁性悬念|无用描写|信息牌|契诃夫之枪|缺德话|幽默节拍|藏拙张力|退无可退|埋下伏笔'
    severity: high
    example: '正文里出现“契诃夫之枪”“埋下伏笔”“退无可退”等策划术语禁'
  - name: 对话标签循环
    regex: '(冷笑|柔声|淡淡)道[：:""]'
    severity: low
    example: '“冷笑道”“淡淡道”循环标签少，用动作替代'
  - name: AI式升华结尾
    regex: '(无尽的黑暗|未知的深渊|刀山火海|真正的风暴[^。]*还在后面|这只是开始|无路可退|大戏的序幕|只能向前)'
    severity: high
    example: '“真正的风暴还在后面”“这只是开始”式AI升华结尾禁'
