version: 21
updated: "2026-08-26"
note: "全部规律来自 nww-novel-skill E1系列盲评实验与9本书拆解，evidence字段可溯源"

laws:
  # ===== 素材规律（scope: material → 创意开发器检查清单）=====
  - id: 1
    name: 开篇三件套
    scope: [material, planner]
    rules:
      - "第1章500字内完成：具体困境+异常侵入+信息差，缺一不可"
      - "困境必须具体（倒计时/欠债/濒死），抽象的惨无效"
  - id: 2
    name: 金手指债务论
    scope: [material]
    rules:
      - "没有无代价的金手指：每次获得附带新约束"
      - "金手指必须是初始困境的延伸而非外挂；解决旧问题的同时制造新问题"
      - "3章内完成首次价值验证；第一个大爽点5~9章兑现"
      - "含知识成分：主角赢在懂规矩会操盘，不是纯战力碾压"
  - id: 3
    name: 冲突五级放大链
    scope: [material, planner]
    rules:
      - "个人绝境→身边人→地方势力→幕后势力→天下大势，每级结尾埋下一级的钩"
      - "敌人必须有自洽逻辑（曾经成功过的规则体系），胜利=以智破规"
      - "前20章敌人无一次性角色"
  - id: 4
    name: 爽点=被看见
    scope: [material, planner]
    rules:
      - "爽点三件套：事件+在场见证者+见证者反应；数值只是计量表"
      - "类型排序：认可>获得>打脸；打脸对象三章内登场"
      - "节奏：严肃向每3章一小爽10章一大爽；轻松向1~3章一爽"
  - id: 5
    name: 设定藏在流程里
    scope: [material, design]
    rules:
      - "前5章硬设定<3条，其余拆散塞进场景需要里"
      - "设定以流程/仪轨/规矩形式发放；能量化就量化"

  # ===== 设计规律（scope: design）=====
  - id: 6
    name: 人物卡v2必填
    scope: [design]
    rules:
      - "身份/核心欲望/性格缺陷/语言习惯与口癖(全书唯一防撞车)/人化细节(与剧情无关的小物件或习惯)"
      - "喜剧角色追加喜剧配方：傲慢方向(只准对准对手)+缺德话公式(自私包装成大义)+护短逻辑"
      - "状态字段动态维护：修为/伤势/知情表/持有物"

  # ===== 规划规律（scope: planner）=====
  - id: 7
    name: 蓝图七要素
    scope: [planner]
    rules:
      - "每场景：任务/地点/人物所求/冲突/转折/结果 + 反派伤害动作"
      - "全章四表：幽默节拍位 / 道具兑现表(契诃夫之枪) / 无用描写点位 / 钩子类型"
      - "章末钩子必须威胁性悬念：具体坏事即将发生"
      - "反派每章≥1次主动出手伤害主角利益，且出自自洽利益"
      - "信息牌分摊：开篇第一句只定调一张牌，此后每段最多一张新牌"
      - "新登场的具名角色必须在new_cards_introduced中带口癖声明，且自称不得与已有角色冲突"
      - "出场具名角色必须来自圣经人物卡(name字段)；除new_cards_introduced声明的新配角外，禁止新造具名角色(尤其禁止凭空给主角加第二个对手名)"
      - "蓝图必须含realm_track字段：{{start,end}}，写明本章起止境界"
      - "蓝图必须含protagonist_choice字段：主角本章的1次主动抉择(做什么+图什么)；认输/躺平也算，但必须显出心眼"
  - id: 8
    name: 爽点代价质感
    scope: [planner, writer_rules]
    rules:
      - "突破/升级必须携带疼痛损耗；舒服的突破=轻的爽"
      - "高级形态三线合一：道具+剧痛+功法编进同一段描写"
      - "代价必须可计数：量化刻度(如丹田裂纹七道致命)，正文以「当前裂纹：N/7」固定格式显性计数，跨章只进不退；上限语(裂到第七道神仙难救)不算计数"
      - "主角动机锚点(圣经anchor字段)须在第一章落成一句独白，此后每逢绝境可回响"
      - "打脸层次律：反派战败必写三拍——震撼→恐惧/不解→怨毒，至少给反派一小段视角写'他不明白自己怎么输的'；禁一拳即晕一笔带过"
  - id: 9
    name: 危机层级递进
    scope: [planner]
    rules:
      - "章末威胁单位尽量升维：个人恩怨<制度压迫(执法堂>管事)"

  # ===== 写作规则（scope: writer_rules → Writer System）=====
  - id: 10
    name: 基础笔法
    scope: [writer_rules]
    rules:
      - "段落分层：短段1-25字(对话/动作)、中段26-75字(叙事主力)、长段76-150字(心理/背景，连续≤2段)、超长段150-220字(单章≤3处，后跟短段缓冲)；对话独立成段；单句≤140字；单段≤本章15%"
      - "禁止直接命名情绪，只用身体反应呈现"
      - "每个场景至少一处无用描写：与剧情无关的环境感官细节或离题记忆闪回"
      - "场景允许在情绪顶点突然切换；圆滑过渡衔接词全章≤1次"
      - "幽默放场景内部；最后一段冷下来收威胁钩"
  - id: 11
    name: 幽默配角声音配方
    scope: [writer_rules, planner]
    rules:
      - "傲慢只对准竞争对手和外部世界；对主角嫌弃但护短"
      - "每场景至少一句缺德话：把自私包装成大义或委屈"
      - "关系升级用嘴硬式台词软化：'别误会，不是护你，是护自己的脸面'"
      - "伏笔纪律：新具名角色要么本章闭环要么留关系钩"
  - id: 12
    name: 留白律
    scope: [writer_rules]
    rules:
      - "关系只用行为痕迹呈现；禁用路标词：下意识地/看向XX/他意识到/似乎在暗示"
  - id: 13
    name: 契诃夫之枪
    scope: [writer_rules, planner]
    rules:
      - "道具多次出现必须层层递进；同一状态重复3次=死线"
      - "当章无法兑现功能时至少给一次异常预兆"

  # ===== 负面清单（scope: writer_negative）=====
  - id: 14
    name: AI味负面清单
    scope: [writer_negative]
    rules:
      - "排比堆砌、'第一感觉第二感觉'式罗列"
      - "'不是X而是Y'句式全章≤1次"
      - "段末升华金句≤2处"
      - "'仿佛/似乎/宛如'每千字≤3处"
      - "模板比喻黑名单：无形的手/寒意从脚底升起/看怪物一样"
      - "对话标签循环超过对话1/3"
      - "系统流痕迹：【】提示框/'检测到宿主'"
      - "教科书式完整起承转合收尾"
  - id: 15
    name: 结尾画面律
    scope: [writer_rules]
    rules:
      - "最后一段必须是画面或动作，禁止章节摘要式总结句"
      - "对话自称必须严格符合人物卡口癖；已占用自称(如老夫)禁止分配给其他角色"
      - "修为境界数字必须逐字遵循蓝图与状态快照：起点/突破后/突破幅度三者一致，禁止自创数字"
      - "末段硬律：最后一句话必须是具体画面或动作(如反派收袖冷笑/主角攥物转身)，绝对禁止抽象展望句。禁词：正在逼近|即将来临|这只是开始|退路已断|命运的齿轮|一场大戏|他不知道的是。病句示例：'具体的坏事，正在逼近。' 良句示例：'刘管事把羊皮纸慢慢收进袖中，三角眼里浮起一丝笑意，像已看见猎物走进笼子。'"
      - "生活化具象比喻优先选用有质感喻体(食物/账本/职场/旧物件)，服务画面；非必要不强行堆砌比喻"
      - "同一句内禁止混用他人自称：功法只用老夫/老子，绝不可在同一句里出现本少爷/本管事"
      - "台词一律用引号；【】仅限≤5字无标点的功法名强调，禁止括号包整句台词或数值面板"
  - id: 16
    name: Prompt泄漏防护
    scope: [writer_rules]
    rules:
      - "蓝图/规划词汇禁止原样出现在正文（如'退无可退''具体的坏事''威胁性悬念'）"

  # ===== 工程规律（scope: engine，不进prompt）=====
  - id: 17
    name: 状态显式供给
    scope: [engine]
    rules:
      - "不信任模型长程记忆；每章注入上章摘要+状态快照(含时间戳/知情表)"
  - id: 21
    name: 峰值比喻律
    scope: [writer_rules, planner]
    rules:
      - "专属意象（sig比喻）用意象种子而非固定句：seed 作为意象基调可自然变体（允许动作/声音/气味/环境反馈承载，而非每次复用同一句、同一'像XX'句式）；每章用 core_feeling（须传递的情绪功能）而非强制原词照抄；优先落在动作、物件、物理反馈或角色化比喻，avoid 固定比喻句复读"
      - "专属比喻优先放在情绪顶点或战败/突破瞬间，让读者'眼前一亮'而非'通顺即可'"

  - id: 22
    name: 锚点回声律
    scope: [writer_rules]
    rules:
      - "每章正文必须出现 bible.plant_checks.motivation_anchor 指定的锚点词（如'天花板'），缺即 high"
      - "锚点句宜自然嵌入叙事（回忆/对比/决心），禁止独立成段的口号式重复"

  - id: 23
    name: 代价不可逆律
    scope: [writer_rules]
    rules:
      - "代价装置（裂纹/诅咒/债务等）一旦建立，禁止出现'愈合''修复''消退''恢复''好转''减轻''消失'等回退描述"
      - "代价只能持平或加深；若需减轻，必须通过新事件（如找到解药）并经 planner 确认，不能在叙述中悄悄好转"

  - id: 24
    name: 纯文本律
    scope: [writer_rules]
    rules:
      - "正文首行允许且必须为 `# 第N章 章名` 标题行（章名与细纲首行一致）；首行之外禁止 markdown 格式标记：*斜体*、**粗体**、`代码`、# 标题——LLM 常见泄漏，必须清除"
      - "对话/心理活动用引号或破折号表达，不用格式标记强调"

  - id: 25
    name: 视角一致律
    scope: [writer_rules]
    rules:
      - "全书视角由 bible.pov 声明（first/third），每章自检：first-person 叙述段'我'占比>60%，third-person 叙述段角色名+'他'占比>60%"
      - "视角突转（如第三章突然切第一人称）即 high，需整章重写"

  - id: 26
    name: 手法冷却与句式去重律
    scope: [writer_rules, planner]
    rules:
      - "修辞冷却期：明喻/隐喻在正文中冷却间距 ≥ 600 字，单章比喻总数 ≤ 3 处，禁止复读机式连环比喻"
      - "描写手段落地分流：威压/气场落地为「生理反应或物理环境反馈」（严禁'像沉睡的兽'等抽象定性）；打斗交锋落地为「力矩/支点/受力材质/接触声」；心理活动落地为「具体利益盘算与手头动作」"
      - "同构句式禁连续：严禁相邻段落采用相同的句式结构起笔或收束"
